<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbiter — Sports Arbitrage Scanner</title>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <main>
    <div class="page-header">
      <div>
        <h2 data-i18n="dashboard">Tablă</h2>
        <div class="text-xs muted" style="margin-top:4px">
          <span id="last-updated">—</span>
        </div>
      </div>
      <div class="meta">
        <span class="chip blue"><span class="dot" id="data-health-dot"></span><span id="data-health" data-i18n="loadingDataHealth"></span></span>
        <span class="chip outline"><span class="dot" id="conn-dot"></span><span id="conn-state" data-i18n="connected">connected</span></span>
        <button class="ghost lang-toggle" data-lang-toggle>RO</button>
      </div>
    </div>

    <!-- KPI strip -->
    <div class="grid cols-4" style="margin-bottom:24px">
      <a class="card card-hover" href="/admin/scanner.html">
        <div class="kpi">
          <div class="label"><span data-i18n="opportunities">Opportunities</span> <span class="chip green text-xs" data-i18n="confirmed">+ confirmed</span></div>
          <div class="value" id="m-opps">—</div>
          <div class="delta">
            <span data-i18n="autoConfirmed">auto-confirmed:</span> <span class="strong" id="m-confirmed">—</span>
          </div>
        </div>
      </a>
      <a class="card card-hover" href="/admin/scanner.html">
        <div class="kpi">
          <div class="label"><span data-i18n="middlesLabel">Middles</span> <span class="chip purple text-xs" data-i18n="twoWay">2-way</span></div>
          <div class="value accent" id="m-middles">—</div>
          <div class="delta">
            <span data-i18n="pendingReview">pending review:</span> <span class="strong yellow" id="m-review">—</span>
          </div>
        </div>
      </a>
      <a class="card card-hover" href="/admin/scanner.html">
        <div class="kpi">
          <div class="label"><span data-i18n="evBets">+EV bets</span> <span class="chip yellow text-xs" data-i18n="softBook">soft book</span></div>
          <div class="value" id="m-ev">—</div>
          <div class="delta">
            <span data-i18n="lowHold">low hold:</span> <span class="strong" id="m-low">—</span>
          </div>
        </div>
      </a>
      <a class="card card-hover" href="/admin/scrape.html">
        <div class="kpi">
          <div class="label"><span data-i18n="sources">Sources</span> <span class="chip text-xs" data-i18n="books">books</span></div>
          <div class="value" id="m-src">—</div>
          <div class="delta">
            <span data-i18n="eventsPriced">events priced:</span> <span class="strong tabnum" id="m-events">—</span>
          </div>
        </div>
      </a>
    </div>

    <!-- Top opportunities -->
    <div class="card">
      <h3>
        <span data-i18n="topOpportunities">Top opportunities</span>
        <span class="h3-meta" data-i18n="sortedByRoi">Sorted by ROI · live updates every 15s</span>
      </h3>
      <div id="opp-list"></div>
    </div>

    <!-- Top +EV bets -->
    <div class="card" id="ev-card">
      <h3>
        <span data-i18n="topEvBets">Top +EV bets</span>
        <a class="h3-meta" href="/admin/scanner.html" data-i18n="viewAllInScanner">View all in scanner</a>
      </h3>
      <div class="table-wrap">
        <table class="compact">
          <thead>
            <tr>
              <th data-i18n="match">Match</th>
              <th data-i18n="selection">Selection</th>
              <th data-i18n="bookmaker">Book</th>
              <th class="num" data-i18n="odds">Odds</th>
              <th class="num">EV%</th>
              <th class="num" data-i18n="stake">Stake</th>
            </tr>
          </thead>
          <tbody id="ev-list"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/sse.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages/dashboard.js"></script>
</body>
</html>
