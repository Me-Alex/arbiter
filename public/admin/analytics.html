<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbiter — Analytics</title>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <main>
    <div class="page-header">
      <div>
        <h2 data-i18n="analytics">Analytics</h2>
        <div class="text-xs muted" style="margin-top:4px">
          Tracker · market catalog · scan signals
        </div>
      </div>
      <div class="meta">
        <button class="ghost lang-toggle" data-lang-toggle>RO</button>
      </div>
    </div>

    <!-- Signals -->
    <section id="signals" style="margin-bottom:20px">
      <div class="grid cols-4">
        <div class="card">
          <div class="kpi">
            <div class="label">Opps (verified)</div>
            <div class="value tabnum green" id="k-opps">—</div>
          </div>
        </div>
        <div class="card">
          <div class="kpi">
            <div class="label">Middles</div>
            <div class="value tabnum purple" id="k-mids">—</div>
          </div>
        </div>
        <div class="card">
          <div class="kpi">
            <div class="label">+EV</div>
            <div class="value tabnum yellow" id="k-ev">—</div>
          </div>
        </div>
        <div class="card">
          <div class="kpi">
            <div class="label">Low hold</div>
            <div class="value tabnum accent" id="k-low">—</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tracker -->
    <section id="tracker" style="margin-bottom:20px">
      <div class="card">
        <h3>
          <span data-i18n="tracker">Bet tracker</span>
          <span class="h3-meta"><span id="tracker-count">0 items</span></span>
        </h3>
        <div class="row" style="margin-bottom:14px">
          <button class="primary" id="add-bet" data-i18n="addBet">Add bet</button>
          <button class="ghost" id="export-csv" data-i18n="export">Export CSV</button>
          <button class="ghost" id="import-csv" data-i18n="import">Import CSV</button>
          <div class="spacer"></div>
          <span class="chip"><span class="dot"></span> local tracker</span>
        </div>
        <div class="table-wrap" style="border:0;background:transparent">
          <table class="compact" id="tracker-table">
            <thead><tr>
              <th>Event</th>
              <th>Market</th>
              <th>Selection</th>
              <th>Book</th>
              <th class="num">Odds</th>
              <th class="num">Stake</th>
              <th>Status</th>
              <th class="num">Actions</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Catalog -->
    <section id="catalog">
      <div class="card">
        <h3>
          <span>Market catalog</span>
          <span class="h3-meta">discovered markets across all books</span>
        </h3>
        <div class="row" style="margin-bottom:14px">
          <div class="field" style="flex:1;margin:0;max-width:320px">
            <input type="text" id="cat-search" placeholder="Filter source / market...">
          </div>
        </div>
        <div class="table-wrap" style="border:0;background:transparent">
          <table class="compact" id="catalog-table">
            <thead><tr>
              <th>Source</th>
              <th>Market</th>
              <th class="num">Events</th>
              <th class="num">Selections</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <link rel="stylesheet" href="/css/analytics.css">
  <dialog id="add-bet-dialog" class="arbiter-modal" aria-labelledby="add-bet-title" aria-modal="true">
    <header>
      <h3 id="add-bet-title">Add bet</h3>
      <button type="button" class="ghost icon" aria-label="Close dialog" data-close-add-bet title="Close">×</button>
    </header>
    <form id="add-bet-form" method="dialog" novalidate>
      <div class="field"><label for="ab-selection">Selection *</label><input id="ab-selection" name="selection" type="text" required autocomplete="off" placeholder="e.g. FCSB"></div>
      <div class="grid">
        <div class="field"><label for="ab-odds">Odds *</label><input id="ab-odds" name="odds" type="number" step="0.01" min="1.01" required placeholder="2.10"></div>
        <div class="field"><label for="ab-stake">Stake *</label><input id="ab-stake" name="stake" type="number" step="0.01" min="0.01" required placeholder="100"></div>
      </div>
      <div class="grid">
        <div class="field"><label for="ab-source">Book</label><input id="ab-source" name="sourceId" type="text" placeholder="betano"></div>
        <div class="field"><label for="ab-market">Market</label><input id="ab-market" name="marketKey" type="text" value="MATCH_ODDS"></div>
      </div>
      <div class="row" style="margin-top:var(--s-5)">
        <button type="submit" class="primary">Save</button>
        <button type="button" class="ghost" data-close-add-bet>Cancel</button>
      </div>
      <p id="add-bet-error" class="alert hidden" role="alert" aria-live="polite"></p>
    </form>
  </dialog>
  <dialog id="import-csv-dialog" class="arbiter-modal" aria-labelledby="import-csv-title" aria-modal="true">
    <header>
      <h3 id="import-csv-title">Import CSV</h3>
      <button type="button" class="ghost icon" aria-label="Close dialog" data-close-import-csv title="Close">×</button>
    </header>
    <form id="import-csv-form" method="dialog" novalidate>
      <div class="field"><label for="import-csv-input">Paste CSV (id,... headers in row 1)</label><textarea id="import-csv-input" name="csv" rows="8" required placeholder="id,selection,odds,stake&#10;1,FCSB,2.10,100"></textarea></div>
      <div class="row" style="margin-top:var(--s-5)">
        <button type="submit" class="primary">Import</button>
        <button type="button" class="ghost" data-close-import-csv>Cancel</button>
      </div>
      <p id="import-csv-error" class="alert hidden" role="alert" aria-live="polite"></p>
    </form>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/sse.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages/analytics.js"></script>
</body>
</html>
