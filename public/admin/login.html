<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArbEdge — Admin</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/arbedge.css">
</head>
<body>
  <div class="login">
    <form class="card" id="login-form">
      <div class="brand">
        <div class="logo">A</div>
        <div>
          <h2>ArbEdge Admin</h2>
        </div>
        <div class="spacer"></div>
        <button type="button" class="ghost lang-toggle" data-lang-toggle aria-label="Toggle language">EN</button>
      </div>
      <p class="muted" data-i18n="loginMuted">Local-only access · this build does not implement remote authentication.</p>
      <div class="alert info" style="margin-top:14px;font-size:11.5px" data-i18n="loginAlert">
        Administrative pages are available only through the loopback-bound local server. Do not expose this application to a network without real server-side authentication.
      </div>
      <div class="row" style="margin-top:18px">
        <a href="/admin/scrape.html" class="btn primary" style="flex:1" data-i18n="loginOpen">Open local control</a>
        <a href="/" class="muted" data-i18n="back">← back</a>
      </div>
    </form>
  </div>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
