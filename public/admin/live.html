<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArbEdge — Live</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/arbedge.css">
</head>
<body class="edge min-h-screen flex">

  <!-- Shared sidebar mounts from /js/app.js -->
<!-- Main Content -->
  <main class="flex-1 p-4 lg:p-6 space-y-6">
    <div class="flex items-center justify-between">
      <h1 class="text-xl lg:text-2xl font-bold text-[var(--edge-textBright)]">Live Arbitrage</h1>
      <span id="engine-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs bg-[var(--edge-surface2)] border border-[var(--edge-border)] text-[var(--edge-text)]">
        <span class="status-dot bg-[var(--edge-textMuted)]" id="engine-dot" aria-hidden="true"></span>
        <span id="engine-state">—</span>
      </span>
    </div>

    <!-- KPI Row -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
      <div class="card p-4">
        <div class="text-xs text-[var(--edge-textMuted)] mb-1">Engine</div>
        <div class="text-2xl font-bold text-[var(--edge-textBright)]" id="k-state">—</div>
        <div class="text-xs text-[var(--edge-textMuted)] mt-1" id="k-state-sub">—</div>
      </div>
      <div class="card p-4">
        <div class="text-xs text-[var(--edge-textMuted)] mb-1">In-Play Signals</div>
        <div class="text-2xl font-bold text-[var(--edge-green)]" id="k-signals">—</div>
        <div class="text-xs text-[var(--edge-textMuted)] mt-1">From the last published scan</div>
      </div>
      <div class="card p-4">
        <div class="text-xs text-[var(--edge-textMuted)] mb-1">Poll Interval</div>
        <div class="text-2xl font-bold text-[var(--edge-textBright)]" id="k-interval">—</div>
        <div class="text-xs text-[var(--edge-textMuted)] mt-1">Seconds between rounds</div>
      </div>
      <div class="card p-4">
        <div class="text-xs text-[var(--edge-textMuted)] mb-1">Last Poll</div>
        <div class="text-2xl font-bold text-[var(--edge-textBright)]" id="k-lastpoll">—</div>
        <div class="text-xs text-[var(--edge-textMuted)] mt-1" id="k-lastrun">—</div>
      </div>
    </div>

    <!-- Engine controls -->
    <div class="card p-4 lg:p-5">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-sm font-semibold text-[var(--edge-textBright)]">
            <label for="eng-enabled">Polling Engine</label>
          </h2>
          <p class="text-xs text-[var(--edge-textMuted)] mt-1" id="engine-note">
            Polls the per-book price feeds on an interval and republishes the scan.
          </p>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" class="toggle" id="eng-enabled">
          <span class="text-sm text-[var(--edge-textBright)]" id="eng-enabled-label">Disabled</span>
        </div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-xs text-[var(--edge-textMuted)] mb-1" for="eng-interval">Interval (seconds)</label>
          <input type="number" id="eng-interval" class="w-full" min="10" step="5">
        </div>
        <div>
          <span class="block text-xs text-[var(--edge-textMuted)] mb-1">Books in this round</span>
          <div class="w-full px-3 py-2 rounded-lg bg-[var(--edge-surface2)] border border-[var(--edge-border)] text-[var(--edge-textBright)] text-sm font-medium truncate" id="eng-books">—</div>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button id="btn-poll" class="px-3 py-1.5 rounded-lg text-xs bg-[var(--edge-blue)] text-white hover:bg-[var(--edge-blue)]/90 transition-colors focus-ring">Poll now</button>
        <button id="btn-apply" class="px-3 py-1.5 rounded-lg text-xs bg-[var(--edge-surface2)] border border-[var(--edge-border)] text-[var(--edge-text)] hover:text-[var(--edge-textBright)] hover:border-[var(--edge-border2)] transition-colors focus-ring">Apply</button>
      </div>
    </div>

    <!-- In-play signals -->
    <div class="card p-4 lg:p-5">
      <h2 class="text-sm font-semibold text-[var(--edge-textBright)] mb-4">In-Play Signals</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 lg:gap-4" id="signal-grid"></div>
    </div>

    <!-- Price events -->
    <div class="card p-4 lg:p-5">
      <h2 class="text-sm font-semibold text-[var(--edge-textBright)] mb-4">Price Events</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-[var(--edge-border)] text-left text-xs text-[var(--edge-textMuted)] uppercase tracking-wider">
              <th class="px-3 py-2 font-medium">Book</th>
              <th class="px-3 py-2 font-medium">Event</th>
              <th class="px-3 py-2 font-medium">Market</th>
              <th class="px-3 py-2 font-medium text-right">Odds</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-[var(--edge-border)]" id="table-events"></tbody>
        </table>
      </div>
    </div>
  </main>


  <script src="/js/i18n.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/pages/common.js" defer></script>
  <script src="/js/sse.js" defer></script>
  <script src="/js/connection-status.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/pages/live.js" defer></script>
</body>
</html>
