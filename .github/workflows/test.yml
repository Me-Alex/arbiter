name: test

# Two gates in one workflow, because a single `on:` block is the only form
# YAML allows here: a second `on:` would silently replace the first.
#
#   push / pull_request  the unit gate — lint plus the full suite, no network.
#   schedule / manual    the live gate — the 22 public bookmaker endpoints.
#
# The live job is scheduled rather than per-push because it calls 22 public
# endpoints, and a provider being briefly unreachable is not a defect in this
# repository. Mondays and Thursdays at 06:10 UTC: after the European evening
# slate has settled, before the weekend's early fixtures.
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '10 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    # A generous ceiling: the browser-backed UI test launches a real Chromium,
    # and the full suite runs ~450 cases.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # `npm ci` installs the playwright *package* but not the browser
      # binaries, and test/scrape-ui.browser.test.mjs launches a real Chromium.
      # Without this the unit gate fails on a clean runner for a reason that has
      # nothing to do with the code. The system libraries are needed too, which
      # is what `install-deps` resolves.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      # Lint and tests are separate steps on purpose: a lint failure should not
      # hide whether the tests pass, and neither should mask the other.
      - name: Unit tests
        run: npm test

      # The measured-outcome table is generated from the measurement journal,
      # which is gitignored, so a clean runner has no journal to compare against.
      # Skipping is the honest outcome here; the live-smoke job is where the
      # journal actually grows, and the check below covers the shape of a row.
      - name: Measurement table matches the journal
        if: hashFiles('data/measurements.jsonl') != ''
        run: npm run measure:sync

  live-smoke:
    name: live smoke (public endpoints)
    # Only on the schedule or a manual dispatch: this reaches the internet.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # betano is the one adapter that drives a real browser, so the live gate
      # needs the same binaries the unit gate does. Without them it fails on
      # the launch rather than on anything to do with the feed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The gate exits non-zero when an enabled job brings back no usable
      # events, or does not complete cleanly. This is the check that would
      # have caught a scraper silently collecting nothing, which is how four
      # separate defects survived a green unit suite: a run that reports
      # "status: ok, events: 0" looks exactly like a quiet market day.
      #
      # The gate writes its own result: a per-book table into the job summary
      # and a machine-readable report. Keeping it `if: always()` means the
      # table is there to read precisely when the run failed, which is the only
      # time anyone opens it.
      - name: Record a measurement round
        run: npm run measure -- --rounds 1

      - name: Smoke the enabled adapters
        run: npm run smoke:live -- --timeout 55000

      # A measurement per scheduled run, so the series behind
      # docs/no-arbitrage-root-cause.md grows on its own instead of being
      # re-derived by hand whenever someone wants to quote it. One round: a
      # second opinion on every book, not a harvest, which is what the gate
      # above is for.
      - name: Archive the measurement journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements
          path: data/measurements.jsonl
          if-no-files-found: ignore
          retention-days: 365
      # Keep the last few reports so the next scheduled run can compare against
      # them. Without a history, a provider that starts returning nothing fails
      # every run from then on and nothing connects those failures — each one
      # reads as a bad day rather than as a feed that moved.
      - name: Restore the previous reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: data-health-*
          path: data-health-history
          merge-multiple: true

      - name: Flag a book that has been failing repeatedly
        run: npm run smoke:trend -- --dir data-health-history

      # Keep this run's report alongside the others, named by when it ran, so
      # the next run can read it. The timestamp uses `-` for the time separators:
      # a colon is not a legal filename character on every platform.
      - name: Save this run's report into the history
        if: always()
        run: |
          stamp="$(${D:-date} -u +%Y-%m-%dT%H-%M-%SZ)"
          mkdir -p data-health-history
          [ -f data-health.json ] && cp data-health.json "data-health-history/$stamp.json" || true
      - name: Archive the smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-health
          path: data-health.json
          if-no-files-found: ignore
          retention-days: 90
